[project]
name = "auspify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Solomon Maidawa Kure", email = "42439912+Kure18@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "streamlit>=1.67.0",
]

[project.scripts]
auspify = "auspify:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
